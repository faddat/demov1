[package]
name = "nunchi-bridge-lab-engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
build = "build.rs"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
commonware-codec = "=2026.9.0"
commonware-consensus = "=2026.9.0"
commonware-cryptography = { version = "=2026.9.0", default-features = false, features = ["bls12381", "mocks"] }
commonware-parallel = { version = "=2026.9.0", default-features = false }
commonware-utils = { version = "=2026.9.0", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
serde_json = "1"
hex = "0.4"
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
overflow-checks = true
