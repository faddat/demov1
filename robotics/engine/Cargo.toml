[package]
name = "nunchi-robotics-lab-engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nunchi-common = { package = "nunchi-common-wasm-adapter", path = "common-adapter" }
nunchi-crypto = { path = "sdk-crypto" }
nunchi-oracle = { path = "sdk-oracle" }
commonware-codec = "=2026.9.0"
commonware-cryptography = { version = "=2026.9.0", default-features = false }
serde_json = "1"
hex = "0.4"
futures = "0.3"
thiserror = "2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
overflow-checks = true
